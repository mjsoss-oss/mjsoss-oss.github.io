<body>

</div>

<button class="tab-btn" id="tab-scan" onclick="goTab('scan')"><span class="ico">📷</span>스캔</button>
</div><script>
var KK='11a04ee8514fc04d127e70fd3efd9fe0';
var KEY_DATA='ss_data5',KEY_DONE='ss_done5',KEY_COORDS='ss_coords5',KEY_ORDER='ss_order5',KEY_LOCKED='ss_locked5';

var markerMap={},myMarker=null,myCircle=null,currentTab='map',loadSortMode='tracking';

var map=L.map('map',{zoomControl:true}).setView([37.556,126.920],13);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19}).addTo(map);
navigator.geolocation&&navigator.geolocation.watchPosition(function(pos){var la=pos.coords.latitude,ln=pos.coords.longitude,ac=pos.coords.accuracy;if(myMarker){myMarker.setLatLng([la,ln]);myCircle.setLatLng([la,ln]);myCircle.setRadius(ac)}else{myCircle=L.circle([la,ln],{radius:ac,color:'#3b82f6',fillColor:'#3b82f6',fillOpacity:0.15,weight:1}).addTo(map);myMarker=L.circleMarker([la,ln],{radius:9,color:'white',fillColor:'#3b82f6',fillOpacity:1,weight:3}).addTo(map)}},null,{enableHighAccuracy:true,maximumAge:3000});

locCtrl.onAdd=function(){var btn=L.DomUtil.create('button','');btn.innerHTML='📍';btn.style.cssText='width:42px;height:42px;background:white;border:2px solid #ccc;border-radius:10px;font-size:20px;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,0.3);margin-bottom:60px';btn.onclick=function(){myMarker?map.setView(myMarker.getLatLng(),16):navigator.geolocation.getCurrentPosition(function(p){map.setView([p.coords.latitude,p.coords.longitude],16)})};return btn};
locCtrl.addTo(map);
function makeIcon(d){var isDone=doneMap[d.id],seq=orderMap[d.id],isOrd=currentTab==='order';var bg,label;if(isOrd){bg=seq?'#f97316':'#6b7280';label=seq?String(seq):'·'}else{bg=isDone?'#22c55e':(seq?'#ef4444':'#6b7280');label=isDone?'✓':(seq?String(seq):'·')}var fs=String(label).length>3?'7px':String(label).length>2?'9px':'11px';var size=isOrd?28:(seq?34:22);return L.divIcon({className:'',html:'<div style="background:'+bg+';color:white;border-radius:50%;width:'+size+'px;height:'+size+'px;display:flex;align-items:center;justify-content:center;font-size:'+fs+';font-weight:900;border:2px solid white;box-shadow:0 2px 6px rgba(0,0,0,0.4)">'+label+'</div>',iconSize:[size,size],iconAnchor:[size/2,size/2],popupAnchor:[0,-size/2-4]})}

function putMarker(d,coord){if(markerMap[d.id])map.removeLayer(markerMap[d.id]);var m=L.marker([coord.lat,coord.lng],{icon:makeIcon(d)}).addTo(map);m.bindPopup(makePopup(d),{maxWidth:290});(function(dd){m.on('click',function(){onMarkerClick(dd)})})(d);markerMap[d.id]=m}

function onMarkerClick(d){if(currentTab==='order'){if(isLocked){alert('🔒 순번이 확정되어 변경할 수 없습니다.');return}orderHistory.push(JSON.parse(JSON.stringify(orderMap)));if(orderMap[d.id]){delete orderMap[d.id];var s=Object.entries(orderMap).sort(function(a,b){return a[1]-b[1]});orderMap={};s.forEach(function(e,i){orderMap[e[0]]=i+1});nextSeq=s.length+1}else{orderMap[d.id]=nextSeq++}save(KEY_ORDER,orderMap);refreshIcons();updHint()}else{if(markerMap[d.id])markerMap[d.id].openPopup()}}

document.getElementById('btn-undo').onclick=function(){if(isLocked){alert('🔒 확정된 순번입니다.');return}if(!orderHistory.length)return;orderMap=orderHistory.pop();var seqs=Object.values(orderMap).filter(function(v){return typeof v==='number'});nextSeq=seqs.length?Math.max.apply(null,seqs)+1:1;save(KEY_ORDER,orderMap);refreshIcons();updHint()};

document.getElementById('btn-save').onclick=function(){if(isLocked){alert('🔒 이미 확정된 순번입니다.');return}var n=Object.keys(orderMap).length;if(!n){alert('지정된 순번이 없습니다.');return}if(!confirm(n+'개 순번을 저장·확정합니다.\n저장 후 변경 불가합니다.\n계속할까요?'))return;isLocked=true;save(KEY_ORDER,orderMap);save(KEY_LOCKED,true);refreshIcons();updHint();alert('🔒 순번 확정!\n적재 탭에서 싣는 순서를 확인하세요.');goTab('map')};
function renderLoad(){var assigned=D.filter(function(d){return orderMap[d.id]});var unassigned=D.filter(function(d){return !orderMap[d.id]});if(loadSortMode==='tracking'){assigned.sort(function(a,b){return String(b.tracking||'').slice(-4).localeCompare(String(a.tracking||'').slice(-4))})}else{assigned.sort(function(a,b){return orderMap[b.id]-orderMap[a.id]})}var h='';if(!assigned.length){h='<div style="padding:40px;text-align:center;color:#64748b">순번 지정 후 저장해주세요.</div>'}else{h+='<div style="padding:8px 12px;background:#0a0c10;border-bottom:1px solid #1e2130;display:flex;align-items:center;justify-content:space-between"><span style="font-size:11px;color:#64748b">총 '+assigned.length+'개</span><div style="display:flex;gap:6px"><button onclick="setLoadSort(\'tracking\')" style="padding:4px 10px;border-radius:6px;border:none;font-size:11px;font-weight:700;cursor:pointer;background:'+(loadSortMode==='tracking'?'#facc15':'#2a2d3a')+';color:'+(loadSortMode==='tracking'?'#1a1000':'#94a3b8')+'">송장번호순</button><button onclick="setLoadSort(\'order\')" style="padding:4px 10px;border-radius:6px;border:none;font-size:11px;font-weight:700;cursor:pointer;background:'+(loadSortMode==='order'?'#22c55e':'#2a2d3a')+';color:'+(loadSortMode==='order'?'white':'#94a3b8')+'">적재순서</button></div></div>';assigned.forEach(function(d,i){var delivSeq=orderMap[d.id],isDone=doneMap[d.id];var t4=String(d.tracking||'').slice(-4);var loadNum=loadSortMode==='order'?(i+1):'';var numBg=loadSortMode==='order'&&i===0?'#facc15':'#2a2d3a';var numColor=loadSortMode==='order'&&i===0?'#1a1000':'#f1f5f9';h+='<div class="load-item" style="'+(isDone?'opacity:0.4;':'')+'"><div class="load-num" style="background:'+numBg+';color:'+numColor+'">'+(loadSortMode==='tracking'?('<b style="font-size:15px;color:#facc15">'+t4+'</b>'):loadNum)+'</div><div class="load-info"><div class="load-name">'+d.name+(d.cashon?'<span class="badge cash">착불</span>':'')+(d.qty>1?'<span class="badge qty">×'+d.qty+'</span>':'')+'</div><div class="load-addr">'+d.addr+'</div>'+(d.product?'<div class="load-prod">'+d.product+'</div>':'')+'</div><div class="load-right"><div class="load-seq">배송<br><b>'+delivSeq+'번</b></div>'+(loadSortMode==='order'?'<div style="font-size:11px;color:#facc15;font-weight:700;margin-top:2px">'+t4+'</div>':'')+'</div></div>'});if(unassigned.length){h+='<div style="padding:8px 16px;font-size:11px;color:#f97316;background:#1a0e00;border-top:2px solid #f97316">⚠️ 순번 미지정 '+unassigned.length+'건</div>';unassigned.forEach(function(d){h+='<div class="load-item"><div class="load-num" style="background:#2a1a00;color:#f97316">?</div><div class="load-info"><div class="load-name">'+d.name+'</div><div class="load-addr">'+d.addr+'</div></div><div class="load-right"><div style="color:#f97316;font-size:11px">미지정</div></div></div>'})}}
document.getElementById('load-list').innerHTML=h}
window.setLoadSort=function(mode){loadSortMode=mode;renderLoad()};
function imgToBase64(file){return new Promise(function(res){var r=new FileReader();r.onload=function(e){res(e.target.result.split(',')[1])};r.readAsDataURL(file)})}
async function scanWaybill(file){var base64=await imgToBase64(file);var mediaType=file.type||'image/jpeg';var resp=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({model:'claude-sonnet-4-20250514',max_tokens:1000,messages:[{role:'user',content:[{type:'image',source:{type:'base64',media_type:mediaType,data:base64}},{type:'text',text:'이 송장 이미지에서 배송 정보를 추출해주세요. 반드시 JSON 형식으로만 답하세요. 다른 텍스트는 절대 포함하지 마세요.\n{"name":"받는사람이름","addr":"받는사람전체주소","phone":"전화번호","tracking":"운송장번호","product":"품명","cashon":false}\n착불이면 cashon을 true로. 정보가 없는 항목은 빈 문자열로.'}]}]})});var data=await resp.json();var text=data.content.map(function(i){return i.text||''}).join('');var clean=text.replace(/```json|```/g,'').trim();return JSON.parse(clean)}
function renderScanList(){var el=document.getElementById('scan-list');if(!scanItems.length){el.innerHTML='';return}var h='';scanItems.forEach(function(item,idx){var ok=item.addr&&item.name;h+='<div class="scan-item '+(ok?'ok':'err')+'" id="si-'+idx+'"><div class="scan-item-head"><span style="font-size:12px;font-weight:700;color:#f1f5f9">'+(idx+1)+'번째 송장</span><div style="display:flex;gap:6px;align-items:center"><span class="scan-item-status '+(ok?'ok':'err')+'">'+(ok?'✅ 인식됨':'⚠️ 확인필요')+'</span><button class="scan-del-btn" onclick="deleteScanItem('+idx+')">삭제</button></div></div><div class="scan-field"><label>받는사람</label><input type="text" value="'+esc(item.name||'')+'" oninput="updateScanItem('+idx+',\'name\',this.value)"></div><div class="scan-field"><label>주소 ⭐</label><input type="text" value="'+esc(item.addr||'')+'" oninput="updateScanItem('+idx+',\'addr\',this.value)"></div><div class="scan-field"><label>전화번호</label><input type="text" value="'+esc(item.phone||'')+'" oninput="updateScanItem('+idx+',\'phone\',this.value)"></div><div class="scan-field"><label>송장번호</label><input type="text" value="'+esc(item.tracking||'')+'" oninput="updateScanItem('+idx+',\'tracking\',this.value)"></div><div class="scan-field"><label>품명</label><input type="text" value="'+esc(item.product||'')+'" oninput="updateScanItem('+idx+',\'product\',this.value)"></div><button class="scan-add-btn" onclick="addScanItem('+idx+')">➕ 지도에 추가</button></div>'});el.innerHTML=h}
function esc(s){return String(s).replace(/"/g,'&quot;').replace(/</g,'&lt;')}
window.updateScanItem=function(idx,key,val){scanItems[idx][key]=val;var el=document.getElementById('si-'+idx);if(el){var ok=scanItems[idx].addr&&scanItems[idx].name;el.className='scan-item '+(ok?'ok':'err')}};
window.deleteScanItem=function(idx){scanItems.splice(idx,1);renderScanList()};
window.addScanItem=function(idx){var item=scanItems[idx];if(!item.addr){alert('주소를 입력해주세요!');return}if(!item.name){alert('받는사람 이름을 입력해주세요!');return}var d={id:uid(),name:item.name,addr:item.addr,phone:item.phone||'',product:item.product||'',tracking:item.tracking||'',qty:1,cashon:item.cashon||false};D.push(d);save(KEY_DATA,D);scanItems.splice(idx,1);renderScanList();addMarkerForItem(d);updateCount();alert('✅ '+d.name+' 추가됐어요!')};
function handleImageFile(file){if(!file)return;document.getElementById('scan-list').insertAdjacentHTML('afterbegin','<div class="scan-loading">🤖 AI가 송장을 읽는 중...<br><small>잠시만 기다려주세요</small></div>');scanWaybill(file).then(function(result){document.querySelector('.scan-loading')&&document.querySelector('.scan-loading').remove();scanItems.unshift(result);renderScanList()}).catch(function(err){document.querySelector('.scan-loading')&&document.querySelector('.scan-loading').remove();scanItems.unshift({name:'',addr:'',phone:'',tracking:'',product:'',cashon:false});renderScanList();alert('AI 인식 실패. 직접 입력해주세요.\n('+err.message+')')})}
document.getElementById('cam-input').addEventListener('change',function(e){handleImageFile(e.target.files[0]);e.target.value=''});
document.getElementById('gal-input').addEventListener('change',function(e){handleImageFile(e.target.files[0]);e.target.value=''});
window.addManual=function(){var name=document.getElementById('m-name').value.trim();var addr=document.getElementById('m-addr').value.trim();var phone=document.getElementById('m-phone').value.trim();var tracking=document.getElementById('m-tracking').value.trim();var product=document.getElementById('m-product').value.trim();if(!name){alert('이름을 입력해주세요!');return}if(!addr){alert('주소를 입력해주세요!');return}var d={id:uid(),name:name,addr:addr,phone:phone,product:product,tracking:tracking,qty:1,cashon:false};D.push(d);save(KEY_DATA,D);document.getElementById('m-name').value='';document.getElementById('m-addr').value='';document.getElementById('m-phone').value='';document.getElementById('m-tracking').value='';document.getElementById('m-product').value='';addMarkerForItem(d);updateCount();alert('✅ '+d.name+' 추가됐어요!')};
async function addMarkerForItem(d){var c=await geocode(d.addr);if(c){putMarker(d,c);map.setView([c.lat,c.lng],15)}else{alert('⚠️ 주소를 지도에서 찾지 못했어요.\n주소 확인: '+d.addr)}}
async function geocode(addr){if(coordCache[addr])return coordCache[addr];try{var r=await fetch('https://dapi.kakao.com/v2/local/search/address.json?query='+encodeURIComponent(addr),{headers:{'Authorization':'KakaoAK '+KK}});var j=await r.json();if(j.documents&&j.documents[0]){var c={lat:parseFloat(j.documents[0].y),lng:parseFloat(j.documents[0].x)};coordCache[addr]=c;save(KEY_COORDS,coordCache);return c}}catch(e){}return null}
async function loadMarkers(){if(!D.length)return;var sb=document.getElementById('status');sb.style.display='block';var done=0;for(var i=0;i<D.length;i++){var d=D[i],c=await geocode(d.addr);done++;sb.textContent='주소 변환 중 '+done+'/'+D.length+' — '+d.name;if(c)putMarker(d,c);await new Promise(function(r){setTimeout(r,80)})}sb.style.display='none';updateCount();var coords=Object.values(coordCache);if(coords.length>1)map.fitBounds(L.latLngBounds(coords.map(function(c){return[c.lat,c.lng]})),{padding:[40,40]})}
initState();updateCount();updHint();
if(D.length>0)loadMarkers();
</script>
</body>
