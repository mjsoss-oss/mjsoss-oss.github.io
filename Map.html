ty:1,same_cnt:1,kakao:"https://map.kakao.com/?q=서울특별시+마포구+독막로+126"}];
const doneMap=(()=>{try{return JSON.parse(localStorage.getItem(DONE_KEY)||'{}')}catch{return{}}})();
const coordCache=(()=>{try{return JSON.parse(localStorage.getItem(COORDS_KEY)||'{}')}catch{return{}}})();
function saveDone(){localStorage.setItem(DONE_KEY,JSON.stringify(doneMap))}
function saveCoords(){localStorage.setItem(COORDS_KEY,JSON.stringify(coordCache))}
const map=L.map('map').setView([37.5600,126.9200],13);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap',maxZoom:19}).addTo(map);
let myMarker=null,myCircle=null;
navigator.geolocation&&navigator.geolocation.watchPosition(pos=>{const{latitude:lat,longitude:lng,accuracy:acc}=pos.coords;if(myMarker){myMarker.setLatLng([lat,lng]);myCircle.setLatLng([lat,lng]);myCircle.setRadius(acc)}else{myCircle=L.circle([lat,lng],{radius:acc,color:'#4285f4',fillColor:'#4285f4',fillOpacity:0.15,weight:1}).addTo(map);myMarker=L.circleMarker([lat,lng],{radius:9,color:'white',fillColor:'#4285f4',fillOpacity:1,weight:3}).addTo(map)}},null,{enableHighAccuracy:true,maximumAge:3000});
const locBtn=L.control({position:'bottomright'});
locBtn.onAdd=function(){const btn=L.DomUtil.create('button','');btn.innerHTML='📍';btn.style.cssText='width:40px;height:40px;background:white;border:2px solid #ccc;border-radius:8px;font-size:20px;cursor:pointer;box-shadow:0 2px 6px rgba(0,0,0,0.3);';btn.onclick=()=>myMarker?map.setView(myMarker.getLatLng(),16):navigator.geolocation.getCurrentPosition(p=>map.setView([p.coords.latitude,p.coords.longitude],16));return btn};
locBtn.addTo(map);
const markerMap={};let done_count=0;const total=deliveries.length;
function makeIcon(d){const isDone=doneMap[d.id];const bg=isDone?'#4CAF50':'#e94560';const label=isDone?'✓':d.id;const fs=String(label).length>3?'7px':String(label).length>2?'9px':'11px';return L.divIcon({className:'',html:`<div style="background:${bg};color:white;border-radius:50%;width:34px;height:34px;display:flex;align-items:center;justify-content:center;font-size:${fs};font-weight:900;border:2px solid white;box-shadow:0 2px 6px rgba(0,0,0,0.4);font-family:Arial">${label}</div>`,iconSize:[34,34],iconAnchor:[17,17],popupAnchor:[0,-20]})}
function makePopup(d){const isDone=doneMap[d.id];const qtyTag=d.qty>1?`<div class="qty-tag">📦 수량 ${d.qty}개</div>`:'';return`<div class="info-popup"><div class="pnum">${d.id}번 ${isDone?'✅':''}</div>${qtyTag}<div class="pname">${d.name}</div><div class="paddr">${d.addr}</div><div class="pprod">${d.product}</div><div class="pmeta">송장뒷4자리: <b>${d.last4}</b></div><a class="kakao-btn" href="${d.kakao}" target="_blank">🗺️ 카카오맵으로 보기</a><button class="done-btn ${isDone?'undone':''}" onclick="toggleDone('${d.id}')">${isDone?'↩ 완료 취소':'✅ 배송 완료'}</button></div>`}
function toggleDone(id){doneMap[id]=!doneMap[id];saveDone();const d=deliveries.find(x=>x.id===id);if(d){markerMap[id].setIcon(makeIcon(d));markerMap[id].setPopupContent(makePopup(d))}updateCount()}
function updateCount(){const doneN=Object.values(doneMap).filter(Boolean).length;document.getElementById('count').textContent=`완료 ${doneN}/${total}건`}
async function geocode(addr){if(coordCache[addr])return coordCache[addr];const url=`https://dapi.kakao.com/v2/local/search/address.json?query=${encodeURIComponent(addr)}`;const res=await fetch(url,{headers:{'Authorization':`KakaoAK ${REST_API_KEY}`}});const json=await res.json();if(json.documents&&json.documents.length>0){const coord={lat:parseFloat(json.documents[0].y),lng:parseFloat(json.documents[0].x)};coordCache[addr]=coord;saveCoords();return coord}return null}
async function addMarker(d){const coord=await geocode(d.addr);done_count++;document.getElementById('status').textContent=`변환 중 ${done_count}/${total}`;if(!coord)return;const marker=L.marker([coord.lat,coord.lng],{icon:makeIcon(d)}).addTo(map);marker.bindPopup(makePopup(d),{maxWidth:280});markerMap[d.id]=marker;if(done_count===total){document.getElementById('status').style.display='none';updateCount()}}
async function loadAll(){for(const d of deliveries){await addMarker(d);await new Promise(r=>setTimeout(r,80))}}
updateCount();loadAll();
</script>
