locBtn.onAdd=function(){const btn=L.DomUtil.create('button','');btn.innerHTML='📍';btn.style.cssText='width:40px;height:40px;background:white;border:2px solid #ccc;border-radius:8px;font-size:20px;cursor:pointer;box-shadow:0 2px 6px rgba(0,0,0,0.3);';btn.onclick=()=>myMarker?map.setView(myMarker.getLatLng(),16):navigator.geolocation.getCurrentPosition(p=>map.setView([p.coords.latitude,p.coords.longitude],16));return btn};
locBtn.addTo(map);
const markerMap={};let done_count=0;const total=deliveries.length;
function makeIcon(d){const isDone=doneMap[d.id];const bg=isDone?'#aaa':'#4CAF50';const label=isDone?'✓':d.id;const fs=String(label).length>3?'7px':String(label).length>2?'9px':'11px';return L.divIcon({className:'',html:`<div style="background:${bg};color:white;border-radius:50%;width:32px;height:32px;display:flex;align-items:center;justify-content:center;font-size:${fs};font-weight:900;border:2px solid white;box-shadow:0 2px 6px rgba(0,0,0,0.4);font-family:Arial">${label}</div>`,iconSize:[32,32],iconAnchor:[16,16],popupAnchor:[0,-18]})}
function makePopup(d){const isDone=doneMap[d.id];const kakaoUrl='https://map.kakao.com/?q='+encodeURIComponent(d.addr);return`<div class="info-popup"><div class="pnum">${d.id}번 ${isDone?'✅':''}</div><div class="pname">${d.name}</div><div class="paddr">${d.addr}</div><div class="pmeta">📞 ${d.phone||'-'}<br>송장: ${d.tracking}</div><a class="kakao-btn" href="${kakaoUrl}" target="_blank">🗺️ 카카오맵으로 보기</a><button class="done-btn ${isDone?'undone':''}" onclick="toggleDone('${d.id}')">${isDone?'↩ 완료 취소':'✅ 배송 완료'}</button></div>`}
function toggleDone(id){doneMap[id]=!doneMap[id];saveDone();const d=deliveries.find(x=>x.id===id);if(d){markerMap[id].setIcon(makeIcon(d));markerMap[id].setPopupContent(makePopup(d))}updateCount()}
function updateCount(){const doneN=Object.values(doneMap).filter(Boolean).length;document.getElementById('count').textContent=`완료 ${doneN}/${total}건`}
async function geocode(addr){if(coordCache[addr])return coordCache[addr];const url=`https://dapi.kakao.com/v2/local/search/address.json?query=${encodeURIComponent(addr)}`;const res=await fetch(url,{headers:{'Authorization':`KakaoAK 11a04ee8514fc04d127e70fd3efd9fe0`}});const json=await res.json();if(json.documents&&json.documents.length>0){const coord={lat:parseFloat(json.documents[0].y),lng:parseFloat(json.documents[0].x)};coordCache[addr]=coord;saveCoords();return coord}return null}
async function loadAll(){for(const d of deliveries){const coord=await geocode(d.addr);done_count++;document.getElementById('status').textContent=`변환 중 ${done_count}/${total}`;if(coord){const marker=L.marker([coord.lat,coord.lng],{icon:makeIcon(d)}).addTo(map);marker.bindPopup(makePopup(d),{maxWidth:280});markerMap[d.id]=marker;}if(done_count===total){document.getElementById('status').style.display='none';updateCount()}await new Promise(r=>setTimeout(r,80))}document.getElementById('status').style.display='none';updateCount();}
updateCount();loadAll();
</script>
</body>
</html>
