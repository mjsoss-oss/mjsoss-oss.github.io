<style>

.seq-input{width:52px;padding:5px 6px;background:#1a1d27;border:1px solid #2a2d3a;border-radius:6px;color:#f1f5f9;font-size:12px;text-align:center}
.seq-assign-btn{padding:5px 8px;background:#22c55e;color:white;border:none;border-radius:6px;font-size:11px;font-weight:700;cursor:pointer;white-space:nowrap}
#scan-view{position:fixed;top:48px;left:0;right:0;bottom:54px;background:#0f1117;overflow-y:auto;z-index:8000;display:none;padding:16px}
#scan-view.show{display:block}
.scan-title{font-size:15px;font-weight:800;color:#22c55e;margin-bottom:4px}
.scan-sub{font-size:11px;color:#64748b;margin-bottom:12px}
.scan-btn{width:100%;padding:14px;background:#1a2a1a;border:2px dashed #22c55e;border-radius:16px;color:#22c55e;font-size:13px;font-weight:700;cursor:pointer;margin-bottom:10px;display:flex;align-items:center;justify-content:center;gap:8px}

.scan-item-status.ok{background:#0d2a0d;color:#22c55e}
.scan-item-status.err{background:#2a0d0d;color:#ef4444}
.scan-field{margin-bottom:6px}
.scan-field label{font-size:10px;color:#64748b;display:block;margin-bottom:2px}
.scan-field input{width:100%;background:#0f1117;border:1px solid #2a2d3a;border-radius:6px;padding:6px 8px;color:#f1f5f9;font-size:12px;font-family:inherit}

.scan-add-btn{width:100%;padding:10px;background:#22c55e;color:white;border:none;border-radius:8px;font-size:13px;font-weight:700;cursor:pointer;margin-top:6px}
.ret-add-btn{width:100%;padding:10px;background:#7c3aed;color:white;border:none;border-radius:8px;font-size:13px;font-weight:700;cursor:pointer;margin-top:6px}
.scan-del-btn{background:#2a1a1a;color:#ef4444;border:none;border-radius:6px;padding:4px 10px;font-size:11px;font-weight:700;cursor:pointer}

.section-divider{margin:16px 0;padding-top:16px;border-top:1px solid #2a2d3a}
.section-label{font-size:13px;font-weight:700;color:#94a3b8;margin-bottom:10px}
.manual-field{margin-bottom:8px}
.manual-field label{font-size:11px;color:#64748b;display:block;margin-bottom:3px}
.manual-field input{width:100%;background:#1a1d27;border:1px solid #2a2d3a;border-radius:8px;padding:8px 10px;color:#f1f5f9;font-size:13px;font-family:inherit}
.manual-field input:focus{outline:none;border-color:#22c55e}
.manual-add-btn{width:100%;padding:12px;background:#3b82f6;color:white;border:none;border-radius:10px;font-size:14px;font-weight:700;cursor:pointer;margin-top:4px}
.info-popup{padding:14px 16px;min-width:220px;max-width:270px}
.info-popup .pnum{font-size:22px;font-weight:900;color:#22c55e;margin-bottom:2px}
.info-popup .pnum.undone{color:#ef4444}
.info-popup .pnum.ret{color:#a78bfa}
.info-popup .pnum.retdone{color:#22c55e}
.info-popup .pname{font-weight:700;color:#111;font-size:15px;margin:3px 0}
.info-popup .paddr{color:#444;font-size:13px;line-height:1.6;margin-bottom:6px;font-weight:500}
.info-popup .pprod{background:#f0fff4;color:#2e7d32;padding:4px 8px;border-radius:6px;font-size:11px;margin-bottom:6px}
.info-popup .pret{background:#ede9fe;color:#5b21b6;padding:4px 8px;border-radius:6px;font-size:11px;margin-bottom:6px}
.info-popup .pmeta{color:#888;font-size:11px;margin-bottom:8px}
.info-popup .qty-tag{display:inline-block;background:#ff9800;color:white;padding:2px 7px;border-radius:4px;font-size:11px;font-weight:700;margin-bottom:6px}
.info-popup .cash-tag{display:inline-block;background:#7c3500;color:#fed7aa;padding:2px 7px;border-radius:4px;font-size:11px;font-weight:700;margin-bottom:6px}
.kakao-btn{display:block;padding:9px;background:#FFCD00;color:#3C1E1E;border:none;border-radius:8px;font-size:13px;font-weight:800;cursor:pointer;width:100%;text-align:center;text-decoration:none;margin-bottom:6px}
.sms-btn{display:block;padding:9px;background:#1d4ed8;color:white;border:none;border-radius:8px;font-size:13px;font-weight:700;cursor:pointer;width:100%;margin-bottom:6px;text-decoration:none;text-align:center}
.done-btn{display:block;padding:9px;background:#22c55e;color:white;border:none;border-radius:8px;font-size:13px;font-weight:700;cursor:pointer;width:100%}
.done-btn.undo{background:#475569}
.done-btn.ret{background:#7c3aed}
.done-btn.ret.undo{background:#475569}
.leaflet-popup-content-wrapper{border-radius:14px!important;padding:0!important}
.leaflet-popup-content{margin:0!important}
</style>
</head>
<body>
<div id="header"><h1>🚚 신성맵</h1><span id="count">데이터 없음</span></div>
<div id="status"></div>
<div id="order-bar">
<button class="obar-btn undo" id="btn-undo">↩ 되돌리기</button>
<span id="order-hint">핀을 탭해서 순번 지정</span>
<button class="obar-btn reset" id="btn-reset">🗑 초기화</button>
<button class="obar-btn save" id="btn-save">🔒 저장·확정</button>
</div>
<div id="order-badge">📌 순번 지정 모드</div>
<div id="map"></div>
<div id="order-view">
<div class="lv-head">
<div class="lv-title">📌 미지정 배송지 목록</div>
<div class="lv-sub">카카오맵으로 위치 확인 후 순번 입력하세요</div>
</div>
<div id="unassigned-list"></div>
</div>
<div id="load-view">
<div class="lv-head"><div class="lv-title">📦 적재 순서</div><div class="lv-sub">마지막 배송지부터 → 1번을 맨 나중에 실으세요</div></div>
<div id="load-list"></div>
</div>
<div id="scan-view">
<div class="scan-title">📷 배송지 추가 / 반품 등록</div>
<div class="scan-sub">배송지 추가 또는 반품 지역을 등록하세요.</div>
<button class="scan-btn" onclick="document.getElementById('cam-input').click()"><span class="ico">📸</span> 카메라로 송장 찍기</button>
<button class="scan-btn" style="background:#1a1a2b;border-color:#3b82f6;color:#93c5fd" onclick="document.getElementById('gal-input').click()"><span class="ico">🖼️</span> 갤러리에서 선택</button>
<button class="scan-btn" style="background:#1a1a0a;border-color:#facc15;color:#facc15" onclick="document.getElementById('xl-input').click()"><span class="ico">📊</span> 엑셀 파일 업로드</button>
<input type="file" id="cam-input" accept="image/*" capture="environment" style="display:none">
<input type="file" id="gal-input" accept="image/*" style="display:none">
<input type="file" id="xl-input" accept=".xlsx,.xls" style="display:none">
<div id="scan-list"></div>
<div class="section-divider">
<div class="section-label">✏️ 배송지 수동 입력</div>
<div class="manual-field"><label>받는사람 이름</label><input type="text" id="m-name" placeholder="홍길동"></div>
<div class="manual-field"><label>주소</label><input type="text" id="m-addr" placeholder="서울 마포구 ..."></div>
<div class="manual-field"><label>전화번호</label><input type="tel" id="m-phone" placeholder="010-0000-0000"></div>
<div class="manual-field"><label>송장번호</label><input type="text" id="m-tracking" placeholder="12641600000"></div>
<div class="manual-field"><label>품명</label><input type="text" id="m-product" placeholder="(선택사항)"></div>
<div class="manual-field"><label>끼워넣을 순번 <span style="color:#64748b;font-weight:400">(비우면 마지막)</span></label><input type="number" id="m-seq" placeholder="예: 5"></div>
<button class="manual-add-btn" onclick="addManual()">➕ 배송지 추가</button>
</div>
<div class="section-divider">
<div class="section-label">↩ 반품 지역 등록</div>
<div class="manual-field"><label>고객 이름</label><input type="text" id="r-name" placeholder="홍길동"></div>
<div class="manual-field"><label>주소 ⭐</label><input type="text" id="r-addr" placeholder="서울 마포구 ..."></div>
<div class="manual-field"><label>전화번호</label><input type="tel" id="r-phone" placeholder="010-0000-0000"></div>
<div class="manual-field"><label>송장번호</label><input type="text" id="r-tracking" placeholder="12641600000"></div>
<div class="manual-field"><label>반품 사유</label><input type="text" id="r-reason" placeholder="수취거부 / 주소오류 / 고객요청 등"></div>
<button class="ret-add-btn" onclick="addReturn()">↩ 반품 등록</button>
</div>
</div>
<div id="footer">
<button class="tab-btn active" id="tab-map" onclick="goTab('map')"><span class="ico">🗺️</span>지도</button>
<button class="tab-btn" id="tab-order" onclick="goTab('order')"><span class="ico">📌</span>순번</button>
<button class="tab-btn" id="tab-load" onclick="goTab('load')"><span class="ico">📦</span>적재</button>
<button class="tab-btn" id="tab-scan" onclick="goTab('scan')"><span class="ico">📷</span>추가</button>
</div><script>
var KK='11a04ee8514fc04d127e70fd3efd9fe0';
var KEY_DATA='ss_data8',KEY_DONE='ss_done8',KEY_COORDS='ss_coords8',KEY_ORDER='ss_order8',KEY_LOCKED='ss_locked8';
var KEY_RET='ss_ret8',KEY_RDONE='ss_rdone8';
var D=[],R=[],doneMap={},retDoneMap={},coordCache={},orderMap={},orderHistory=[],isLocked=false,nextSeq=1;
var markerMap={},retMarkerMap={},myMarker=null,myCircle=null,currentTab='map',loadSortMode='tracking';
var scanItems=[];
function load(k,def){try{return JSON.parse(localStorage.getItem(k))||def}catch(e){return def}}
function save(k,v){localStorage.setItem(k,JSON.stringify(v))}
function uid(){return 'd'+Date.now()+Math.random().toString(36).slice(2,6)}
function initState(){
  D=load(KEY_DATA,[]);R=load(KEY_RET,[]);
  doneMap=load(KEY_DONE,{});retDoneMap=load(KEY_RDONE,{});
  coordCache=load(KEY_COORDS,{});orderMap=load(KEY_ORDER,{});isLocked=load(KEY_LOCKED,false);
  var seqs=Object.values(orderMap).filter(function(v){return typeof v==='number'});
  nextSeq=seqs.length?Math.max.apply(null,seqs)+1:1;
}
var map=L.map('map',{zoomControl:true}).setView([37.556,126.920],13);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19}).addTo(map);
navigator.geolocation&&navigator.geolocation.watchPosition(function(pos){
  var la=pos.coords.latitude,ln=pos.coords.longitude,ac=pos.coords.accuracy;
  if(myMarker){myMarker.setLatLng([la,ln]);myCircle.setLatLng([la,ln]);myCircle.setRadius(ac)}
  else{myCircle=L.circle([la,ln],{radius:ac,color:'#3b82f6',fillColor:'#3b82f6',fillOpacity:0.15,weight:1}).addTo(map);myMarker=L.circleMarker([la,ln],{radius:9,color:'white',fillColor:'#3b82f6',fillOpacity:1,weight:3}).addTo(map)}
},null,{enableHighAccuracy:true,maximumAge:3000});
var locCtrl=L.control({position:'bottomright'});
locCtrl.onAdd=function(){var btn=L.DomUtil.create('button','');btn.innerHTML='📍';btn.style.cssText='width:42px;height:42px;background:white;border:2px solid #ccc;border-radius:10px;font-size:20px;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,0.3);margin-bottom:60px';btn.onclick=function(){myMarker?map.setView(myMarker.getLatLng(),16):navigator.geolocation.getCurrentPosition(function(p){map.setView([p.coords.latitude,p.coords.longitude],16)})};return btn};
locCtrl.addTo(map);
var delCtrl=L.control({position:'topright'});
delCtrl.onAdd=function(){
  var div=L.DomUtil.create('div','');
  div.style.cssText='display:flex;flex-direction:column;gap:6px;margin-top:8px;margin-right:4px';
  var btn1=L.DomUtil.create('button','',div);
  btn1.innerHTML='✅ 완료 삭제';
  btn1.style.cssText='padding:6px 10px;background:#0d2a0d;color:#22c55e;border:1px solid #22c55e;border-radius:8px;font-size:11px;font-weight:700;cursor:pointer;white-space:nowrap;box-shadow:0 2px 6px rgba(0,0,0,0.3)';
  L.DomEvent.on(btn1,'click',function(){
    var targets=D.filter(function(d){return doneMap[d.id]});
    if(!targets.length){alert('완료된 배송지가 없어요.');return}
    if(!confirm('완료된 배송지 '+targets.length+'개를 삭제할까요?'))return;
    targets.forEach(function(d){if(markerMap[d.id]){map.removeLayer(markerMap[d.id]);delete markerMap[d.id]}delete doneMap[d.id];delete orderMap[d.id]});
    D=D.filter(function(d){return !targets.find(function(t){return t.id===d.id})});
    save(KEY_DATA,D);save(KEY_DONE,doneMap);save(KEY_ORDER,orderMap);
    updateCount();updHint();alert('✅ '+targets.length+'개 삭제됐어요!');
  });
  var btn2=L.DomUtil.create('button','',div);
  btn2.innerHTML='⚫ 미지정 삭제';
  btn2.style.cssText='padding:6px 10px;background:#1a1a1a;color:#94a3b8;border:1px solid #4b5563;border-radius:8px;font-size:11px;font-weight:700;cursor:pointer;white-space:nowrap;box-shadow:0 2px 6px rgba(0,0,0,0.3)';
  L.DomEvent.on(btn2,'click',function(){
    var targets=D.filter(function(d){return !orderMap[d.id]&&!doneMap[d.id]});
    if(!targets.length){alert('미지정 배송지가 없어요.');return}
    if(!confirm('순번 미지정 배송지 '+targets.length+'개를 삭제할까요?'))return;
    targets.forEach(function(d){if(markerMap[d.id]){map.removeLayer(markerMap[d.id]);delete markerMap[d.id]}delete doneMap[d.id]});
    D=D.filter(function(d){return !targets.find(function(t){return t.id===d.id})});
    save(KEY_DATA,D);save(KEY_DONE,doneMap);
    updateCount();updHint();alert('⚫ '+targets.length+'개 삭제됐어요!');
  });
  var btn3=L.DomUtil.create('button','',div);
  btn3.innerHTML='🗑 전체 삭제';
  btn3.style.cssText='padding:6px 10px;background:#2a0a0a;color:#ef4444;border:1px solid #ef4444;border-radius:8px;font-size:11px;font-weight:700;cursor:pointer;white-space:nowrap;box-shadow:0 2px 6px rgba(0,0,0,0.3)';
  L.DomEvent.on(btn3,'click',function(){
    if(!confirm('배송 목록 전체를 삭제할까요?\n순번·완료 기록도 모두 초기화됩니다.'))return;
    D=[];R=[];doneMap={};retDoneMap={};orderMap={};isLocked=false;nextSeq=1;
    save(KEY_DATA,D);save(KEY_DONE,doneMap);save(KEY_ORDER,orderMap);save(KEY_LOCKED,false);save(KEY_RET,R);save(KEY_RDONE,retDoneMap);
    Object.values(markerMap).forEach(function(m){map.removeLayer(m)});markerMap={};
    Object.values(retMarkerMap).forEach(function(m){map.removeLayer(m)});retMarkerMap={};
    updateCount();updHint();alert('🗑 전체 삭제 완료!');
  });
  return div;
};
delCtrl.addTo(map);
function makeIcon(d){
  var isDone=doneMap[d.id],seq=orderMap[d.id],isOrd=currentTab==='order';
  var bg,label;
  if(isOrd){bg=seq?'#f97316':'#6b7280';label=seq?String(seq):'·'}
  else{bg=isDone?'#22c55e':(seq?'#ef4444':'#6b7280');label=isDone?'✓':(seq?String(seq):'·')}

      var hs=rows[hr].map(function(h){return cs(h)});
      function gi(){for(var ni=0;ni<arguments.length;ni++){for(var hi=0;hi<hs.length;hi++){if(hs[hi].indexOf(arguments[ni])>=0)return hi}}return -1}
      var iN=gi('받는사람'),iA=gi('주소','받는사람주소'),iP=gi('도착전화번호','배송전화번호','받는사람전화');
      var iPr=gi('상품명','품명'),iPr2=gi('등록품명'),iT=gi('운송장번호','운송장','송장'),iQ=gi('수량'),iCA=gi('현/착','구분');
      var nd=[];
      for(var ri=hr+1;ri<rows.length;ri++){
        var row=rows[ri];if(!row||!Array.isArray(row))continue;
        var addr=iA>=0?cs(row[iA]):'';if(!addr||addr==='-')continue;
        var name=iN>=0?(cs(row[iN])||'이름없음'):'이름없음';
        var product='';if(iPr>=0)product=cs(row[iPr]);if(!product&&iPr2>=0)product=cs(row[iPr2]);
        var cashStr=iCA>=0?cs(row[iCA]):'';
        nd.push({id:uid(),name:name,addr:addr,phone:iP>=0?cs(row[iP]):'',product:product,tracking:iT>=0?cs(row[iT]):'',qty:iQ>=0?(Number(row[iQ])||1):1,cashon:cashStr==='착불'});
      }
      if(!nd.length){alert('데이터를 찾을 수 없어요.');return}
      if(!confirm('엑셀 '+nd.length+'건을 추가할까요?'))return;
      nd.forEach(function(d){D.push(d)});save(KEY_DATA,D);updateCount();loadMarkers();goTab('map');
      alert('✅ '+nd.length+'건 추가됐어요!');
    }catch(err){alert('파일 오류: '+err.message)}
  };
  reader.readAsBinaryString(file);e.target.value='';
});
window.addManual=function(){
  var name=document.getElementById('m-name').value.trim();
  var addr=document.getElementById('m-addr').value.trim();
  var phone=document.getElementById('m-phone').value.trim();
  var tracking=document.getElementById('m-tracking').value.trim();
  var product=document.getElementById('m-product').value.trim();
  var seqInput=document.getElementById('m-seq').value.trim();
  if(!name){alert('이름을 입력해주세요!');return}
  if(!addr){alert('주소를 입력해주세요!');return}
  var d={id:uid(),name:name,addr:addr,phone:phone,product:product,tracking:tracking,qty:1,cashon:false};
  D.push(d);save(KEY_DATA,D);
  if(seqInput&&!isNaN(Number(seqInput))){var insertAt=Number(seqInput);Object.keys(orderMap).forEach(function(id){if(orderMap[id]>=insertAt)orderMap[id]+=1});orderMap[d.id]=insertAt;nextSeq=Math.max.apply(null,Object.values(orderMap))+1;save(KEY_ORDER,orderMap)}
  document.getElementById('m-name').value='';document.getElementById('m-addr').value='';document.getElementById('m-phone').value='';document.getElementById('m-tracking').value='';document.getElementById('m-product').value='';document.getElementById('m-seq').value='';
  addMarkerForItem(d);refreshIcons();updateCount();
  alert('✅ '+d.name+' 추가됐어요!'+(seqInput?' ('+seqInput+'번으로 끼워넣기)':''));
};
window.addReturn=function(){
  var name=document.getElementById('r-name').value.trim();
  var addr=document.getElementById('r-addr').value.trim();
  var phone=document.getElementById('r-phone').value.trim();
  var tracking=document.getElementById('r-tracking').value.trim();
  var reason=document.getElementById('r-reason').value.trim();
  if(!addr){alert('주소를 입력해주세요!');return}
  if(!name){alert('고객 이름을 입력해주세요!');return}
  var r={id:'r'+uid(),name:name,addr:addr,phone:phone,tracking:tracking,reason:reason};
  R.push(r);save(KEY_RET,R);
  document.getElementById('r-name').value='';document.getElementById('r-addr').value='';document.getElementById('r-phone').value='';document.getElementById('r-tracking').value='';document.getElementById('r-reason').value='';
  addRetMarkerForItem(r);updateCount();
  alert('↩ '+r.name+' 반품 등록됐어요!');
};
async function addMarkerForItem(d){var c=await geocode(d.addr);if(c){putMarker(d,c);map.setView([c.lat,c.lng],15)}else{alert('⚠️ 주소를 지도에서 찾지 못했어요.\n주소 확인: '+d.addr)}}
async function addRetMarkerForItem(r){var c=await geocode(r.addr);if(c){putRetMarker(r,c);map.setView([c.lat,c.lng],15)}else{alert('⚠️ 주소를 지도에서 찾지 못했어요.\n주소 확인: '+r.addr)}}
async function geocode(addr){
  if(coordCache[addr])return coordCache[addr];
  try{var res=await fetch('https://dapi.kakao.com/v2/local/search/address.json?query='+encodeURIComponent(addr),{headers:{'Authorization':'KakaoAK '+KK}});var j=await res.json();if(j.documents&&j.documents[0]){var c={lat:parseFloat(j.documents[0].y),lng:parseFloat(j.documents[0].x)};coordCache[addr]=c;save(KEY_COORDS,coordCache);return c}}catch(e){}return null;
}
async function loadMarkers(){
  if(!D.length&&!R.length)return;
  var sb=document.getElementById('status');sb.style.display='block';
  var all=D.concat(R);
  for(var i=0;i<all.length;i++){
    var item=all[i];var c=await geocode(item.addr);
    sb.textContent='주소 변환 중 '+(i+1)+'/'+all.length+' — '+item.name;
    if(c){if(item.id.startsWith('r'))putRetMarker(item,c);else putMarker(item,c)}
    await new Promise(function(r){setTimeout(r,80)});
  }
  sb.style.display='none';updateCount();
  var coords=Object.values(coordCache);
  if(coords.length>1)map.fitBounds(L.latLngBounds(coords.map(function(c){return[c.lat,c.lng]})),{padding:[40,40]});
}
initState();updateCount();updHint();
if(D.length>0||R.length>0)loadMarkers();
</script>
