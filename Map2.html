<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>신성맵 2</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;background:#0f1117;color:#f1f5f9;font-family:'Apple SD Gothic Neo','Malgun Gothic',sans-serif;overflow:hidden}
#header{position:fixed;top:0;left:0;right:0;height:48px;background:#0d1117;border-bottom:2px solid #f97316;display:flex;align-items:center;justify-content:space-between;padding:0 14px;z-index:9999}
#header h1{font-size:15px;color:#f97316;font-weight:800}
#count{font-size:12px;color:#94a3b8}
#map{position:fixed;top:48px;left:0;right:0;bottom:54px;z-index:1}
#status{position:fixed;top:48px;left:0;right:0;background:rgba(0,0,0,0.85);color:#fff;font-size:11px;text-align:center;padding:4px;z-index:9000;display:none}
#order-bar{position:fixed;top:48px;left:0;right:0;background:rgba(10,15,25,0.97);border-bottom:1px solid #2a2d3a;padding:8px 12px;display:none;gap:8px;align-items:center;flex-wrap:wrap;z-index:8999}
#order-bar.show{display:flex}
#order-hint{font-size:11px;color:#64748b;flex:1;text-align:center}
.obar-btn{padding:7px 13px;border-radius:8px;border:none;font-size:12px;font-weight:700;cursor:pointer}
.obar-btn.undo{background:#1e2030;color:#f1f5f9}
.obar-btn.reset{background:#2a1a1a;color:#ef4444}
.obar-btn.save{background:#f97316;color:white}
#order-badge{position:fixed;left:50%;transform:translateX(-50%);top:108px;background:rgba(249,115,22,0.95);color:white;padding:6px 18px;border-radius:20px;font-size:12px;font-weight:700;z-index:8997;display:none;white-space:nowrap}
#order-badge.show{display:block}
#footer{position:fixed;bottom:0;left:0;right:0;height:54px;background:#0d1117;border-top:1px solid #2a2d3a;display:flex;z-index:9999}
.tab-btn{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:10px;color:#64748b;border:none;background:none;cursor:pointer}
.tab-btn.active{color:#f97316}
.tab-btn .ico{font-size:20px}
#load-view{position:fixed;top:48px;left:0;right:0;bottom:54px;background:#0f1117;overflow-y:auto;z-index:8000;display:none}
#load-view.show{display:block}
.lv-head{background:#0d1117;padding:12px 16px;border-bottom:1px solid #2a2d3a;position:sticky;top:0;z-index:1}
.lv-title{font-size:15px;font-weight:800;color:#facc15;margin-bottom:3px}
.lv-sub{font-size:11px;color:#64748b}
.load-item{padding:12px 16px;border-bottom:1px solid #1e2130;display:flex;align-items:center;gap:12px}
.load-num{min-width:38px;height:38px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:900;color:white;flex-shrink:0}
.load-info{flex:1;overflow:hidden}
.load-name{font-size:13px;font-weight:700;margin-bottom:2px}
.load-addr{font-size:11px;color:#64748b;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.load-right{text-align:right;flex-shrink:0}
.load-seq b{color:#f1f5f9;font-size:15px}
.info-popup{padding:14px 16px;min-width:220px;max-width:270px}
.info-popup .pnum{font-size:22px;font-weight:900;color:#f97316;margin-bottom:2px}
.info-popup .pnum.done{color:#22c55e}
.info-popup .paddr{color:#444;font-size:13px;line-height:1.6;margin-bottom:8px;font-weight:500}
.kakao-btn{display:block;padding:9px;background:#FFCD00;color:#3C1E1E;border:none;border-radius:8px;font-size:13px;font-weight:800;cursor:pointer;width:100%;text-align:center;text-decoration:none;margin-bottom:6px}
.done-btn{display:block;padding:9px;background:#22c55e;color:white;border:none;border-radius:8px;font-size:13px;font-weight:700;cursor:pointer;width:100%}
.done-btn.undo{background:#475569}
.leaflet-popup-content-wrapper{border-radius:14px!important;padding:0!important}
.leaflet-popup-content{margin:0!important}
</style>
</head>
<body>
<div id="header"><h1>🚚 신성맵 2호</h1><span id="count">로딩 중...</span></div>
<div id="status"></div>
<div id="order-bar">
<button class="obar-btn undo" id="btn-undo">↩ 되돌리기</button>
<span id="order-hint">핀을 탭해서 순번 지정</span>
<button class="obar-btn reset" id="btn-reset">🗑 초기화</button>
<button class="obar-btn save" id="btn-save">🔒 저장·확정</button>
</div>
<div id="order-badge">📌 순번 지정 모드</div>
<div id="map"></div>
<div id="load-view">
<div class="lv-head"><div class="lv-title">📦 적재 순서</div><div class="lv-sub">마지막 배송지부터 → 1번을 맨 나중에 실으세요</div></div>
<div id="load-list"></div>
</div>
<div id="footer">
<button class="tab-btn active" id="tab-map" onclick="goTab('map')"><span class="ico">🗺️</span>지도</button>
<button class="tab-btn" id="tab-order" onclick="goTab('order')"><span class="ico">📌</span>순번</button>
<button class="tab-btn" id="tab-load" onclick="goTab('load')"><span class="ico">📦</span>적재</button>
</div><script>
var KK='11a04ee8514fc04d127e70fd3efd9fe0';
var KEY_DONE='ss2_done',KEY_COORDS='ss2_coords',KEY_ORDER='ss2_order',KEY_LOCKED='ss2_locked';

var D=[
  {id:'a11',  seq:'11',   addr:'서울 마포구 동교로 64-9 2층'},
  {id:'a12',  seq:'12',   addr:'서울 마포구 포은로2가길 37-6 301호'},
  {id:'a13',  seq:'13',   addr:'서울 마포구 포은로2가길 37-6 3층'},
  {id:'a14',  seq:'14',   addr:'서울 마포구 양화로6길 57-18'},
  {id:'a141', seq:'14-1', addr:'서울 마포구 성지길 25-20 201호'},
  {id:'a15',  seq:'15',   addr:'서울 마포구 양화로 72 효성해링턴타워 1313호'},
  {id:'a151', seq:'15-1', addr:'서울 마포구 잔다리로 9 1층 홍대포차'},
  {id:'a16',  seq:'16',   addr:'서울 마포구 상수동 72-1 홍익대학교 Z4-112'},
  {id:'a17',  seq:'17',   addr:'서울 마포구 토정로 320 5층'},
  {id:'a171', seq:'17-1', addr:'서울 마포구 독막로 77 2층 푸줏간살롱'},
  {id:'a172', seq:'17-2', addr:'서울 마포구 와우산로14길 19'},
  {id:'a18',  seq:'18',   addr:'서울 마포구 상수동 345-9 202호'},
  {id:'a19',  seq:'19',   addr:'서울 마포구 토정로18길 11 103동 1302호'},
  {id:'a191', seq:'19-1', addr:'서울 마포구 독막로28길 10 밤섬경남아너스빌 101동 703호'},
  {id:'a21',  seq:'21',   addr:'서울 마포구 고산길 48 402호'},
  {id:'a22',  seq:'22',   addr:'서울 마포구 백범로16안길 33 202호'},
  {id:'a221', seq:'22-1', addr:'서울 마포구 독막로 266 태영아파트 102동 2201호'},
  {id:'a222', seq:'22-2', addr:'서울 마포구 마포대로 33 오벨리스크아파트 222호'},
  {id:'a24',  seq:'24',   addr:'서울 마포구 도화동 357'},
  {id:'a241', seq:'24-1', addr:'서울 마포구 마포대로24길 16 108동 804호'},
  {id:'a25',  seq:'25',   addr:'서울 마포구 마포대로14길 29 연리빌리지 402호'},
  {id:'a26',  seq:'26',   addr:'서울 마포구 공덕동 만리재로 90 블레스하임3차 402호'},
  {id:'a27',  seq:'27',   addr:'서울 마포구 공덕동 43 삼성래미안공덕2차 102동 802호'},
  {id:'a271', seq:'27-1', addr:'서울 마포구 마포대로24길 16 109동 1404호'},
  {id:'a273', seq:'27-3', addr:'서울 마포구 효창원로95길 45 402호'},
  {id:'a29',  seq:'29',   addr:'서울 마포구 손기정로4안길 8 지층좌'},
];

var doneMap={},coordCache={},orderMap={},orderHistory=[],isLocked=false,nextSeq=1;
var markerMap={},myMarker=null,myCircle=null,currentTab='map';

function load(k,def){try{return JSON.parse(localStorage.getItem(k))||def}catch(e){return def}}
function save(k,v){localStorage.setItem(k,JSON.stringify(v))}

function initState(){
  doneMap=load(KEY_DONE,{});coordCache=load(KEY_COORDS,{});
  orderMap=load(KEY_ORDER,{});isLocked=load(KEY_LOCKED,false);
  var seqs=Object.values(orderMap).filter(function(v){return typeof v==='number'});
  nextSeq=seqs.length?Math.max.apply(null,seqs)+1:1;
}

var map=L.map('map',{zoomControl:true}).setView([37.548,126.950],14);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19}).addTo(map);

navigator.geolocation&&navigator.geolocation.watchPosition(function(pos){
  var la=pos.coords.latitude,ln=pos.coords.longitude,ac=pos.coords.accuracy;
  if(myMarker){myMarker.setLatLng([la,ln]);myCircle.setLatLng([la,ln]);myCircle.setRadius(ac)}
  else{
    myCircle=L.circle([la,ln],{radius:ac,color:'#3b82f6',fillColor:'#3b82f6',fillOpacity:0.15,weight:1}).addTo(map);
    myMarker=L.circleMarker([la,ln],{radius:9,color:'white',fillColor:'#3b82f6',fillOpacity:1,weight:3}).addTo(map);
  }
},null,{enableHighAccuracy:true,maximumAge:3000});

var locCtrl=L.control({position:'bottomright'});
locCtrl.onAdd=function(){var btn=L.DomUtil.create('button','');btn.innerHTML='📍';btn.style.cssText='width:42px;height:42px;background:white;border:2px solid #ccc;border-radius:10px;font-size:20px;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,0.3);margin-bottom:60px';btn.onclick=function(){myMarker?map.setView(myMarker.getLatLng(),16):navigator.geolocation.getCurrentPosition(function(p){map.setView([p.coords.latitude,p.coords.longitude],16)})};return btn};
locCtrl.addTo(map);

function makeIcon(d){
  var isDone=doneMap[d.id],seq=orderMap[d.id],isOrd=currentTab==='order';
  var bg,label;
  if(isOrd){bg=seq?'#f97316':'#6b7280';label=seq?String(seq):'·'}
  else{bg=isDone?'#22c55e':(seq?'#ef4444':'#6b7280');label=isDone?'✓':(seq?String(seq):d.seq)}
  var fs=String(label).length>3?'7px':String(label).length>2?'9px':'11px';
  var size=isOrd?28:34;
  return L.divIcon({className:'',html:'<div style="background:'+bg+';color:white;border-radius:50%;width:'+size+'px;height:'+size+'px;display:flex;align-items:center;justify-content:center;font-size:'+fs+';font-weight:900;border:2px solid white;box-shadow:0 2px 6px rgba(0,0,0,0.4)">'+label+'</div>',iconSize:[size,size],iconAnchor:[size/2,size/2],popupAnchor:[0,-size/2-4]});
}

function makePopup(d){
  var isDone=doneMap[d.id],seq=orderMap[d.id];
  return '<div class="info-popup">'
    +'<div class="pnum '+(isDone?'done':'')+'">'+(isDone?'✅ 완료':'📦 '+d.seq+'번')+'</div>'
    +'<div class="paddr">'+d.addr+'</div>'
    +'<a class="kakao-btn" href="https://map.kakao.com/?q='+encodeURIComponent(d.addr)+'" target="_blank">🗺️ 카카오맵으로 보기</a>'
    +'<button class="done-btn '+(isDone?'undo':'')+'\" onclick="toggleDone(\''+d.id+'\')">'+(isDone?'↩ 완료 취소':'✅ 배송 완료')+'</button>'
    +'</div>';
}

function putMarker(d,coord){
  if(markerMap[d.id])map.removeLayer(markerMap[d.id]);
  var m=L.marker([coord.lat,coord.lng],{icon:makeIcon(d)}).addTo(map);
  m.bindPopup(makePopup(d),{maxWidth:290});
  (function(dd){m.on('click',function(){onMarkerClick(dd)})})(d);
  markerMap[d.id]=m;
}

function refreshIcons(){D.forEach(function(d){if(markerMap[d.id]){markerMap[d.id].setIcon(makeIcon(d));markerMap[d.id].setPopupContent(makePopup(d))}})}

function onMarkerClick(d){
  if(currentTab==='order'){
    if(isLocked){alert('🔒 순번이 확정되어 변경할 수 없습니다.');return}
    orderHistory.push(JSON.parse(JSON.stringify(orderMap)));
    if(orderMap[d.id]){delete orderMap[d.id];var s=Object.entries(orderMap).sort(function(a,b){return a[1]-b[1]});orderMap={};s.forEach(function(e,i){orderMap[e[0]]=i+1});nextSeq=s.length+1}
    else{orderMap[d.id]=nextSeq++}
    save(KEY_ORDER,orderMap);refreshIcons();updHint();
  }else{if(markerMap[d.id])markerMap[d.id].openPopup()}
}

window.toggleDone=function(id){
  doneMap[id]=!doneMap[id];save(KEY_DONE,doneMap);
  var d=D.find(function(x){return x.id===id});
  if(d&&markerMap[id]){markerMap[id].setIcon(makeIcon(d));markerMap[id].setPopupContent(makePopup(d))}
  updateCount();
};

function updateCount(){var dn=Object.values(doneMap).filter(Boolean).length;document.getElementById('count').textContent='완료 '+dn+'/'+D.length+'건'}
function updHint(){var n=Object.keys(orderMap).length;document.getElementById('order-hint').textContent=isLocked?'🔒 순번 확정됨':(n?n+'개 순번 지정됨':'핀을 탭해서 순번 지정')}

function goTab(t){
  currentTab=t;
  ['map','order','load'].forEach(function(id){var b=document.getElementById('tab-'+id);if(b)b.classList.toggle('active',id===t)});
  document.getElementById('order-bar').classList.toggle('show',t==='order');
  document.getElementById('order-badge').classList.toggle('show',t==='order');
  document.getElementById('load-view').classList.toggle('show',t==='load');
  if(t==='load')renderLoad();
  refreshIcons();
}

document.getElementById('btn-undo').onclick=function(){if(isLocked){alert('🔒 확정된 순번입니다.');return}if(!orderHistory.length)return;orderMap=orderHistory.pop();var seqs=Object.values(orderMap).filter(function(v){return typeof v==='number'});nextSeq=seqs.length?Math.max.apply(null,seqs)+1:1;save(KEY_ORDER,orderMap);refreshIcons();updHint()};
document.getElementById('btn-reset').onclick=function(){if(isLocked){alert('🔒 확정된 순번입니다.');return}if(!confirm('순번을 모두 초기화할까요?'))return;orderHistory.push(JSON.parse(JSON.stringify(orderMap)));orderMap={};nextSeq=1;save(KEY_ORDER,orderMap);refreshIcons();updHint()};
document.getElementById('btn-save').onclick=function(){if(isLocked){alert('🔒 이미 확정된 순번입니다.');return}var n=Object.keys(orderMap).length;if(!n){alert('지정된 순번이 없습니다.');return}if(!confirm(n+'개 순번을 저장·확정합니다.\n저장 후 변경 불가합니다.\n계속할까요?'))return;isLocked=true;save(KEY_ORDER,orderMap);save(KEY_LOCKED,true);refreshIcons();updHint();alert('🔒 순번 확정!\n적재 탭에서 싣는 순서를 확인하세요.');goTab('map')};

function renderLoad(){
  var assigned=D.filter(function(d){return orderMap[d.id]}).sort(function(a,b){return orderMap[b.id]-orderMap[a.id]});
  var unassigned=D.filter(function(d){return !orderMap[d.id]});
  var h='';
  if(!assigned.length){h='<div style="padding:40px;text-align:center;color:#64748b">순번 지정 후 저장해주세요.</div>'}
  else{
    h+='<div style="padding:8px 16px;font-size:11px;color:#64748b;background:#0a0c10;border-bottom:1px solid #1e2130">총 '+assigned.length+'개 · 아래 순서대로 실으세요 ↓</div>';
    assigned.forEach(function(d,i){
      var isDone=doneMap[d.id],delivSeq=orderMap[d.id],isFirst=i===0;
      h+='<div class="load-item" style="'+(isDone?'opacity:0.4;':'')+'"><div class="load-num" style="background:'+(isFirst?'#facc15':'#2a2d3a')+';color:'+(isFirst?'#1a1000':'#f1f5f9')+'">'+(i+1)+'</div><div class="load-info"><div class="load-name">'+d.seq+'번</div><div class="load-addr">'+d.addr+'</div></div><div class="load-right"><div class="load-seq">배송<br><b>'+delivSeq+'번</b></div></div></div>';
    });
    if(unassigned.length){
      h+='<div style="padding:8px 16px;font-size:11px;color:#f97316;background:#1a0e00;border-top:2px solid #f97316">⚠️ 순번 미지정 '+unassigned.length+'건</div>';
      unassigned.forEach(function(d){h+='<div class="load-item"><div class="load-num" style="background:#2a1a00;color:#f97316">?</div><div class="load-info"><div class="load-name">'+d.seq+'번</div><div class="load-addr">'+d.addr+'</div></div></div>'});
    }
  }
  document.getElementById('load-list').innerHTML=h;
}

async function geocode(addr){
  if(coordCache[addr])return coordCache[addr];
  try{var r=await fetch('https://dapi.kakao.com/v2/local/search/address.json?query='+encodeURIComponent(addr),{headers:{'Authorization':'KakaoAK '+KK}});var j=await r.json();if(j.documents&&j.documents[0]){var c={lat:parseFloat(j.documents[0].y),lng:parseFloat(j.documents[0].x)};coordCache[addr]=c;save(KEY_COORDS,coordCache);return c}}catch(e){}return null;
}

async function loadMarkers(){
  var sb=document.getElementById('status');sb.style.display='block';
  for(var i=0;i<D.length;i++){
    var d=D[i],c=await geocode(d.addr);
    sb.textContent='주소 변환 중 '+(i+1)+'/'+D.length+' — '+d.seq+'번';
    if(c)putMarker(d,c);
    await new Promise(function(r){setTimeout(r,80)});
  }
  sb.style.display='none';updateCount();
  var coords=Object.values(coordCache);
  if(coords.length>1)map.fitBounds(L.latLngBounds(coords.map(function(c){return[c.lat,c.lng]})),{padding:[40,40]});
}

initState();updateCount();updHint();loadMarkers();
</script>
</body>
</html>
