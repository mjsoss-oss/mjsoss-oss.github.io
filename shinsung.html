<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>신성맵 - 천일택배</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{--bg:#0f1117;--card:#1a1d27;--border:#2a2d3a;--green:#22c55e;--red:#ef4444;--blue:#3b82f6;--orange:#f97316;--yellow:#facc15;--text:#f1f5f9;--muted:#64748b;--hh:52px;--fh:56px}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;background:var(--bg);color:var(--text);font-family:'Apple SD Gothic Neo','Malgun Gothic',sans-serif;overflow:hidden}
#header{position:fixed;top:0;left:0;right:0;height:var(--hh);background:#0d1117;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 14px;z-index:9000}
#header h1{font-size:15px;font-weight:800;color:var(--green)}
.stats{font-size:12px;color:var(--muted)}.stats b{color:var(--text)}
#map{position:fixed;top:var(--hh);left:0;right:0;bottom:var(--fh);z-index:1}
#footer{position:fixed;bottom:0;left:0;right:0;height:var(--fh);background:#0d1117;border-top:1px solid var(--border);display:flex;z-index:9000}
.tab-btn{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:10px;color:var(--muted);border:none;background:none;cursor:pointer}
.tab-btn.active{color:var(--green)}.tab-btn .ico{font-size:20px}
#modebar{position:fixed;top:var(--hh);left:0;right:0;background:rgba(13,17,23,0.97);border-bottom:1px solid var(--border);padding:8px 12px;display:none;gap:8px;align-items:center;z-index:8999}
#modebar.show{display:flex}
.mbtn{padding:6px 12px;border-radius:8px;border:none;font-size:12px;font-weight:700;cursor:pointer}
.mbtn.undo{background:#1e2030;color:var(--text)}.mbtn.save{background:var(--green);color:white}.mbtn.reset{background:#2a1a1a;color:var(--red)}
#ohint{font-size:11px;color:var(--muted);flex:1;text-align:center}
#oi{position:fixed;top:calc(var(--hh) + 48px);left:50%;transform:translateX(-50%);background:rgba(250,204,21,0.95);color:#1a1000;padding:6px 16px;border-radius:20px;font-size:12px;font-weight:700;z-index:8997;display:none;white-space:nowrap}
#oi.show{display:block}
#sb{position:fixed;top:var(--hh);left:0;right:0;background:rgba(0,0,0,0.85);color:white;font-size:11px;text-align:center;padding:4px;z-index:8998;display:none}
#lb{position:fixed;bottom:calc(var(--fh)+12px);right:12px;width:44px;height:44px;background:white;border:2px solid #ddd;border-radius:12px;font-size:22px;display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:8990;box-shadow:0 2px 8px rgba(0,0,0,0.3)}
#po{position:fixed;inset:0;background:rgba(0,0,0,0.6);z-index:10000;display:none;align-items:flex-end}
#po.show{display:flex}
#pp{background:var(--card);border-radius:20px 20px 0 0;padding:20px 16px 32px;width:100%;max-height:78vh;overflow-y:auto;border-top:1px solid var(--border)}
.ps{font-size:26px;font-weight:900;margin-bottom:4px}.ps.r{color:var(--red)}.ps.g{color:var(--green)}.ps.b{color:var(--blue)}
.pn{font-size:18px;font-weight:800;margin-bottom:6px}
.pa{font-size:14px;color:var(--text);line-height:1.6;margin-bottom:8px;font-weight:600}
.ppr{background:#1e2a1e;color:#86efac;padding:6px 10px;border-radius:8px;font-size:12px;margin-bottom:6px}
.pm{font-size:12px;color:var(--muted);margin-bottom:12px}
.pca{background:#2a1a0a;color:var(--orange);padding:6px 10px;border-radius:8px;font-size:13px;font-weight:700;margin-bottom:10px}
.pb{display:block;width:100%;padding:12px;border:none;border-radius:10px;font-size:14px;font-weight:700;cursor:pointer;margin-bottom:8px;text-align:center;text-decoration:none}
.pb.kk{background:var(--yellow);color:#1a1000}.pb.dn{background:var(--green);color:white}.pb.ud{background:var(--border);color:var(--text)}.pb.cl{background:#1e2030;color:var(--muted)}
#lv{position:fixed;top:var(--hh);left:0;right:0;bottom:var(--fh);background:var(--bg);overflow-y:auto;z-index:8000;display:none}
#lv.show{display:block}
.li{padding:12px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px;cursor:pointer}
.li.dl{background:#0d1a0d}
.ln{min-width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:900;color:white;flex-shrink:0}
.linf{flex:1;overflow:hidden}.lnm{font-size:13px;font-weight:700}.lad{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lr{text-align:right;flex-shrink:0}.ltr{font-size:11px;color:var(--muted)}.lqt{font-size:11px}
#uv{position:fixed;top:var(--hh);left:0;right:0;bottom:var(--fh);background:var(--bg);overflow-y:auto;z-index:8000;display:none;padding:20px 16px}
#uv.show{display:block}
.uz{border:2px dashed var(--border);border-radius:16px;padding:40px 20px;text-align:center;cursor:pointer;background:var(--card);margin-bottom:16px}
.uico{font-size:48px;margin-bottom:12px}.uz p{font-size:14px;color:var(--muted)}.uz b{color:var(--green)}
.ib{background:var(--card);border-radius:12px;padding:16px;margin-bottom:12px;font-size:12px;color:var(--muted);line-height:1.8}.ib b{color:var(--text)}
</style>
</head>
<body>
<div id="header"><h1>🚚 신성맵</h1><div class="stats">완료 <b id="dc">0</b>/<b id="tc">0</b>건</div></div>
<div id="modebar">
  <button class="mbtn undo" id="btn-undo">↩ 되돌리기</button>
  <span id="ohint">핀을 탭해서 순번 지정</span>
  <button class="mbtn reset" id="btn-reset">🗑 초기화</button>
  <button class="mbtn save" id="btn-save">💾 저장</button>
</div>
<div id="oi">📌 순번 지정 모드 — 핀을 탭하세요</div>
<div id="sb"></div>
<div id="map"></div>
<div id="lb">📍</div>
<div id="po"><div id="pp">
  <div class="ps" id="pseq"></div>
  <div class="pn" id="pname"></div>
  <div class="pa" id="paddr"></div>
  <div class="ppr" id="pprod"></div>
  <div class="pca" id="pcash" style="display:none"></div>
  <div class="pm" id="pmeta"></div>
  <a class="pb kk" id="pkakao" href="#" target="_blank">🗺️ 카카오맵으로 보기</a>
  <button class="pb dn" id="pdone"></button>
  <button class="pb cl" id="pclose">닫기</button>
</div></div>
<div id="lv"><div id="li"></div></div>
<div id="uv">
  <div class="uz" id="uzzone"><div class="uico">📊</div><p><b>엑셀 파일을 탭해서 선택</b></p><p style="margin-top:6px;font-size:12px">.xlsx / .xls 파일</p></div>
  <input type="file" id="fi" accept=".xlsx,.xls" style="display:none">
  <div class="ib"><b>엑셀 컬럼 형식</b><br>도착일자/도착영업소/운송장번호/받는사람/받는사람주소/받는사람전화1/품명/총운임/수량/구분<br><br><b>구분</b>: 착불이면 착불금액 표시</div>
</div>
<div id="footer">
  <button class="tab-btn active" id="tab-map"><span class="ico">🗺️</span>지도</button>
  <button class="tab-btn" id="tab-order"><span class="ico">📌</span>순번</button>
  <button class="tab-btn" id="tab-list"><span class="ico">📋</span>목록</button>
  <button class="tab-btn" id="tab-upload"><span class="ico">📤</span>업로드</button>
</div>
<script>
window.addEventListener('load',function(){
var KK='11a04ee8514fc04d127e70fd3efd9fe0';
var SK='ss_done',CK='ss_coords',OK='ss_order',DK='ss_data';
var D=[],dM={},cC={},oM={},oH=[],mM={};
var mode='map',popId=null,nSeq=1,myMk=null,myCirc=null;
function gl(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}}
function sl(k,v){localStorage.setItem(k,JSON.stringify(v))}
function initData(){dM=gl(SK)||{};cC=gl(CK)||{};oM=gl(OK)||{};D=gl(DK)||[];var vs=Object.values(oM).filter(function(v){return typeof v==='number'});nSeq=vs.length?Math.max.apply(null,vs)+1:1}
var map=L.map('map',{zoomControl:false}).setView([37.555,126.92],13);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19}).addTo(map);
if(navigator.geolocation){navigator.geolocation.watchPosition(function(p){var la=p.coords.latitude,ln=p.coords.longitude,ac=p.coords.accuracy;if(myMk){myMk.setLatLng([la,ln]);myCirc.setLatLng([la,ln]);myCirc.setRadius(ac)}else{myCirc=L.circle([la,ln],{radius:ac,color:'#3b82f6',fillColor:'#3b82f6',fillOpacity:0.15,weight:1}).addTo(map);myMk=L.circleMarker([la,ln],{radius:9,color:'white',fillColor:'#3b82f6',fillOpacity:1,weight:3}).addTo(map)}},null,{enableHighAccuracy:true,maximumAge:3000})}
document.getElementById('lb').addEventListener('click',function(){if(myMk){map.setView(myMk.getLatLng(),16)}else{navigator.geolocation.getCurrentPosition(function(p){map.setView([p.coords.latitude,p.coords.longitude],16)})}});
async function geo(addr){if(cC[addr])return cC[addr];try{var r=await fetch('https://dapi.kakao.com/v2/local/search/address.json?query='+encodeURIComponent(addr),{headers:{'Authorization':'KakaoAK '+KK}});var j=await r.json();if(j.documents&&j.documents[0]){var c={lat:parseFloat(j.documents[0].y),lng:parseFloat(j.documents[0].x)};cC[addr]=c;sl(CK,cC);return c}}catch(e){}return null}
function gCol(d){if(dM[d.id])return'#22c55e';if(d.type==='return')return'#3b82f6';if(D.filter(function(x){return x.addr===d.addr&&!dM[x.id]}).length>1)return'#f97316';return'#ef4444'}
function mkIco(d){var isDone=dM[d.id],seq=oM[d.id],isOrd=mode==='order';var bg=isOrd?(seq?'#f97316':'#4b5563'):gCol(d);var lbl=isOrd?(seq?String(seq):'·'):(isDone?'✓':(seq?String(seq):(d.type==='return'?'↩':'')));var fs=String(lbl).length>2?'9px':'12px';var rot=(!isOrd&&d.type==='return')?'rotate(45deg)':'';var rad=(!isOrd&&d.type==='return')?'4px':'50%';return L.divIcon({className:'',html:'<div style="background:'+bg+';color:white;border-radius:'+rad+';width:32px;height:32px;display:flex;align-items:center;justify-content:center;font-size:'+fs+';font-weight:900;border:2px solid white;box-shadow:0 2px 8px rgba(0,0,0,.5);transform:'+rot+'">'+lbl+'</div>',iconSize:[32,32],iconAnchor:[16,16],popupAnchor:[0,-18]})}
function putMk(d,c){if(mM[d.id])map.removeLayer(mM[d.id]);var m=L.marker([c.lat,c.lng],{icon:mkIco(d)}).addTo(map);(function(dd){m.on('click',function(){onMk(dd)})})(d);mM[d.id]=m}
function refIco(){Object.keys(mM).forEach(function(id){var d=D.find(function(x){return x.id===id});if(d&&mM[id])mM[id].setIcon(mkIco(d))})}
function onMk(d){if(mode==='order'){oH.push(JSON.parse(JSON.stringify(oM)));if(oM[d.id]){delete oM[d.id];var s=Object.entries(oM).sort(function(a,b){return a[1]-b[1]});oM={};s.forEach(function(e,i){oM[e[0]]=i+1});nSeq=s.length+1}else{oM[d.id]=nSeq++}sl(OK,oM);refIco();updHint()}else{showP(d)}}
function updHint(){var n=Object.keys(oM).length;document.getElementById('ohint').textContent=n?n+'개 지정됨':'핀을 탭해서 순번 지정'}
function showP(d){popId=d.id;var isDone=dM[d.id],seq=oM[d.id];var col=d.type==='return'?'b':(isDone?'g':'r');document.getElementById('pseq').className='ps '+col;document.getElementById('pseq').textContent=seq?seq+'번':(d.type==='return'?'↩ 반품':(isDone?'✅ 완료':'📦'));document.getElementById('pname').textContent=d.name;document.getElementById('paddr').textContent=d.addr;document.getElementById('pprod').textContent='📦 '+(d.product||'-');var cc=document.getElementById('pcash');if(d.cashon&&d.cashon>0){cc.textContent='💰 착불 '+Number(d.cashon).toLocaleString()+'원';cc.style.display='block'}else{cc.style.display='none'}var meta='📞 '+(d.phone||'-');if(d.tracking)meta+=' · 송장: '+String(d.tracking).slice(-4);if(d.qty&&d.qty>1)meta+=' · 수량: '+d.qty+'개';document.getElementById('pmeta').textContent=meta;document.getElementById('pkakao').href='https://map.kakao.com/?q='+encodeURIComponent(d.addr);var btn=document.getElementById('pdone');btn.textContent=isDone?(d.type==='return'?'↩ 수거 취소':'↩ 완료 취소'):(d.type==='return'?'✅ 수거 완료':'✅ 배송 완료');btn.className='pb '+(isDone?'ud':'dn');document.getElementById('po').classList.add('show')}
document.getElementById('po').addEventListener('click',function(e){if(e.target===document.getElementById('po'))closeP()});
document.getElementById('pclose').addEventListener('click',closeP);
function closeP(){document.getElementById('po').classList.remove('show');popId=null}
document.getElementById('pdone').addEventListener('click',function(){if(!popId)return;dM[popId]=!dM[popId];sl(SK,dM);var d=D.find(function(x){return x.id===popId});if(d&&mM[popId])mM[popId].setIcon(mkIco(d));updCnt();renderList();showP(d)});
function goTab(t){document.querySelectorAll('.tab-btn').forEach(function(b){b.classList.remove('active')});document.getElementById('tab-'+t).classList.add('active');document.getElementById('lv').classList.remove('show');document.getElementById('uv').classList.remove('show');document.getElementById('modebar').classList.remove('show');document.getElementById('oi').classList.remove('show');document.getElementById('lb').style.display='flex';mode=t==='order'?'order':'map';if(t==='order'){document.getElementById('modebar').classList.add('show');document.getElementById('oi').classList.add('show');updHint()}else if(t==='list'){document.getElementById('lv').classList.add('show');document.getElementById('lb').style.display='none';renderList()}else if(t==='upload'){document.getElementById('uv').classList.add('show');document.getElementById('lb').style.display='none'}refIco()}
document.getElementById('tab-map').addEventListener('click',function(){goTab('map')});
document.getElementById('tab-order').addEventListener('click',function(){goTab('order')});
document.getElementById('tab-list').addEventListener('click',function(){goTab('list')});
document.getElementById('tab-upload').addEventListener('click',function(){goTab('upload')});
document.getElementById('btn-save').addEventListener('click',function(){sl(OK,oM);goTab('map');alert('✅ '+Object.keys(oM).length+'개 순번 저장됐어요!')});
document.getElementById('btn-undo').addEventListener('click',function(){if(!oH.length)return;oM=oH.pop();var vs=Object.values(oM).filter(function(v){return typeof v==='number'});nSeq=vs.length?Math.max.apply(null,vs)+1:1;sl(OK,oM);refIco();updHint()});
document.getElementById('btn-reset').addEventListener('click',function(){if(!confirm('순번을 모두 초기화할까요?'))return;oH.push(JSON.parse(JSON.stringify(oM)));oM={};nSeq=1;sl(OK,oM);refIco();updHint()});
function renderList(){var ac={};D.forEach(function(d){ac[d.addr]=(ac[d.addr]||0)+1});var sorted=D.slice().sort(function(a,b){return String(a.tracking).slice(-4).localeCompare(String(b.tracking).slice(-4))});var h='';sorted.forEach(function(d){var isDone=dM[d.id],seq=oM[d.id],col=d.type==='return'?'#3b82f6':(isDone?'#22c55e':'#ef4444');var lbl=seq||(isDone?'✓':(d.type==='return'?'↩':'·'));h+='<div class="li '+(isDone?'dl':'')+'" data-id="'+d.id+'"><div class="ln" style="background:'+col+'">'+lbl+'</div><div class="linf"><div class="lnm">'+(isDone?'✅ ':'')+d.name+(ac[d.addr]>1?' 📦':'')+'</div><div class="lad">'+d.addr+'</div></div><div class="lr"><div class="ltr">'+String(d.tracking).slice(-4)+'</div><div class="lqt" style="color:'+(d.qty>1?'#f97316':'var(--muted)')+'">×'+(d.qty||1)+'</div></div></div>'});var el=document.getElementById('li');el.innerHTML=h||'<div style="padding:40px;text-align:center;color:var(--muted)">배송 데이터가 없어요<br>엑셀 파일을 업로드해주세요</div>';el.querySelectorAll('.li').forEach(function(item){item.addEventListener('click',function(){var id=this.getAttribute('data-id');var d=D.find(function(x){return x.id===id});if(!d)return;goTab('map');setTimeout(function(){var c=cC[d.addr];if(c)map.setView([c.lat,c.lng],17);showP(d)},150)})})}
function updCnt(){var dn=Object.values(dM).filter(Boolean).length;document.getElementById('dc').textContent=dn;document.getElementById('tc').textContent=D.length}
document.getElementById('uzzone').addEventListener('click',function(){document.getElementById('fi').click()});
document.getElementById('fi').addEventListener('change',function(e){var file=e.target.files[0];if(!file)return;var reader=new FileReader();reader.onload=function(ev){try{var wb=XLSX.read(ev.target.result,{type:'binary'});var ws=wb.Sheets[wb.SheetNames[0]];var rows=XLSX.utils.sheet_to_json(ws,{header:1});var hr=-1;for(var i=0;i<Math.min(5,rows.length);i++){var r=rows[i];if(r&&r.some(function(c){var s=String(c||'');return s.includes('운송장')||s.includes('받는사람')})){hr=i;break}}if(hr===-1)hr=0;var hs=rows[hr].map(function(h){return String(h||'').trim()});function gi(){var ns=Array.prototype.slice.call(arguments);for(var ni=0;ni<ns.length;ni++){var idx=hs.findIndex(function(h){return h.includes(ns[ni])});if(idx>=0)return idx}return -1}var iN=gi('받는사람'),iA=gi('받는사람주소','주소'),iP=gi('받는사람전화','전화'),iPr=gi('품명','상품'),iT=gi('운송장','송장'),iQ=gi('수량'),iC=gi('총운임','운임'),iG=gi('구분');var nd=[];for(var ri=hr+1;ri<rows.length;ri++){var row=rows[ri];if(!row)continue;var addr=String(row[iA]||'').trim();if(!addr)continue;var gs=iG>=0?String(row[iG]||''):'';var isCash=gs.includes('착불');var cashAmt=(isCash&&iC>=0)?(Number(row[iC])||0):0;nd.push({id:'d'+ri+'t'+Date.now(),name:String(row[iN]||'').trim()||'이름없음',addr:addr,phone:String(row[iP]||'').trim(),product:String(row[iPr]||'').trim(),tracking:String(row[iT]||'').trim(),qty:Number(row[iQ])||1,cashon:cashAmt,type:'delivery'})}if(!nd.length){alert('데이터를 찾을 수 없어요.');return}if(D.length>0&&!confirm('기존 '+D.length+'건을 새 '+nd.length+'건으로 교체할까요?'))return;D=nd;sl(DK,D);dM={};sl(SK,dM);oM={};sl(OK,oM);nSeq=1;Object.values(mM).forEach(function(m){map.removeLayer(m)});mM={};updCnt();loadMks();goTab('map');alert('✅ '+D.length+'건 업로드 완료!')}catch(err){alert('파일 오류: '+err.message)}};reader.readAsBinaryString(file)});
async function loadMks(){var sb=document.getElementById('sb');sb.style.display='block';for(var i=0;i<D.length;i++){var d=D[i];var c=await geo(d.addr);sb.textContent='주소 변환 중 '+(i+1)+'/'+D.length;if(c)putMk(d,c);await new Promise(function(r){setTimeout(r,80)})}sb.style.display='none';updCnt()}
initData();updCnt();if(D.length>0)loadMks();
});
</script>
</body>
</html>
